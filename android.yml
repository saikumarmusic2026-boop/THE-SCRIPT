name: Build Android app

# Builds an installable Android file (.apk) of THE SCRIPT.
# Runs when you push to main, when you push a tag like v1.0.0, or when you press "Run workflow".
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['app/**', 'mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Copy the web app into the Android project
        run: rm -rf mobile/www && cp -r app mobile/www && rm -f mobile/www/sw.js
      - name: Install
        working-directory: mobile
        run: npm install
      - name: Create the Android project
        working-directory: mobile
        run: npx cap add android
      - name: Open-.thescript-files and icon
        run: pip install pillow && python3 mobile/patch_android.py
      - name: Sync
        working-directory: mobile
        run: npx cap sync android
      - name: Build the APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: THE-SCRIPT-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/android/app/build/outputs/apk/debug/app-debug.apk
